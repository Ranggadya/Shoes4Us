name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Job 1: Go Backend Quality Gates
  # ==========================================
  backend:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Verify Go Formatting & Vet
        run: |
          cd backend
          go vet ./...

      - name: Run Backend Unit Tests (with Race Detector)
        run: |
          cd backend
          go test -v -race ./...

      - name: Verify Binary Builds
        run: |
          cd backend
          go build -trimpath -o /dev/null ./cmd/api
          go build -trimpath -o /dev/null ./cmd/seed

  # ==========================================
  # Job 2: React Frontend Quality Gates
  # ==========================================
  frontend:
    name: Frontend Lint, Typecheck & Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Source Code
        run: |
          cd frontend
          npm run lint

      - name: Build Production Assets
        run: |
          cd frontend
          npm run build

  # ==========================================
  # Job 3: Docker Images Build Verification
  # ==========================================
  docker-build:
    name: Docker Build Validation
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: shoes4us-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: shoes4us-frontend:ci
