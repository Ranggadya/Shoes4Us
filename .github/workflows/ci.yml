name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-check:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest unit & component tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  backend-check:
    name: Backend Vet, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run unit tests
        run: go test -v ./...

      - name: Verify compilation
        run: go build ./...

  e2e-test:
    name: End-to-End Tests (Playwright + Go API + PostgreSQL)
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-check]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shoes4us
          POSTGRES_PASSWORD: shoes4us_e2e_password
          POSTGRES_DB: shoes4us_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U shoes4us -d shoes4us_e2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgres://shoes4us:shoes4us_e2e_password@localhost:5432/shoes4us_e2e?sslmode=disable
      APP_ENV: development
      AUTH_RATE_LIMIT_PER_MIN: "300"
      PORT: "8080"
      JWT_SECRET: shoes4us-ci-e2e-jwt-secret-key-at-least-32-chars
      ALLOWED_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Seed E2E database
        working-directory: backend
        run: go run ./cmd/seed

      - name: Build and start Go API server
        working-directory: backend
        run: |
          go build -o ./bin/shoes4us-api ./cmd/api
          ./bin/shoes4us-api > /tmp/shoes4us-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health; then
              echo ""
              echo "Backend API is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Backend API failed to become healthy"
          cat /tmp/shoes4us-api.log
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E test suites
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
