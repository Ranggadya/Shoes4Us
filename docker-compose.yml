services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  db:
    image: postgres:16-alpine
    container_name: shoes4us-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shoes4us_db}
      POSTGRES_USER: ${POSTGRES_USER:-shoes4us}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shoes4us_secret_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shoes4us} -d ${POSTGRES_DB:-shoes4us_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - shoes4us-network

  # ==========================================
  # Go REST API Backend
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shoes4us-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-shoes4us}:${POSTGRES_PASSWORD:-shoes4us_secret_123}@db:5432/${POSTGRES_DB:-shoes4us_db}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production_shoes4us_secret_key_12345}
      JWT_EXPIRES_HOURS: ${JWT_EXPIRES_HOURS:-168}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173}
      UPLOAD_DIR: /app/uploads
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Shoes4Us <noreply@shoes4us.com>}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"
    networks:
      - shoes4us-network

  # ==========================================
  # React Frontend (Nginx SPA + Reverse Proxy)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: shoes4us-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - shoes4us-network

volumes:
  postgres_data:
    name: shoes4us_postgres_data
  uploads_data:
    name: shoes4us_uploads_data

networks:
  shoes4us-network:
    name: shoes4us-network
    driver: bridge
